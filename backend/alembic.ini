# Alembic configuration for Navigate AI backend
# See https://alembic.sqlalchemy.org/en/latest/tutorial.html for usage

[alembic]
script_location = migrations
prepend_sys_path = .
version_path_separator = os

# Target database URL — overridden by DATABASE_URL env var at runtime
sqlalchemy.url = postgresql+asyncpg://navigate:navigate_pass@localhost:5432/navigate_ai

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
