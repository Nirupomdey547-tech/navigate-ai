version: "3.9"

services:
  # FastAPI AI Navigation Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: navigate-ai-backend
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=production
      - DATABASE_URL=postgresql+asyncpg://navigate:navigate_pass@postgres:5432/navigate_ai
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=change-in-production-navigate-ai-secret
      - JWT_SECRET_KEY=change-in-production-jwt-secret
      - ALLOWED_ORIGINS=["http://localhost:3000","http://127.0.0.1:3000"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - ./datasets:/app/datasets
      - ./model_checkpoints:/app/model_checkpoints
    restart: unless-stopped

  # Next.js Frontend Interface
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: navigate-ai-frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    depends_on:
      - backend
    restart: unless-stopped

  # PostgreSQL Relational Persistence
  postgres:
    image: postgres:16-alpine
    container_name: navigate-ai-postgres
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=navigate
      - POSTGRES_PASSWORD=navigate_pass
      - POSTGRES_DB=navigate_ai
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U navigate -d navigate_ai"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Redis Cache & Message Broker
  redis:
    image: redis:7-alpine
    container_name: navigate-ai-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
